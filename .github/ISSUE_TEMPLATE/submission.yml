name: Submit a resume (fallback channel)
description: Used by the site when direct submission is unavailable. Everything you enter here is public, exactly like the direct channel.
title: "submission: "
labels: ["ra:submission"]
body:
  - type: markdown
    attributes:
      value: |
        This form is the backup way into ResumeArena. The site fills most fields for you; paste the approved text into the text box.

        **Everything in this issue is public the moment you press Submit**, including the issue history. Do not paste anything you removed in the preview. Do not paste your owner key here; this form never needs it.
  - type: input
    id: submission_id
    attributes:
      label: submission_id
      description: 10 lowercase letters and digits, generated by the site.
    validations:
      required: true
  - type: input
    id: handle
    attributes:
      label: handle
      description: 3 to 20 characters, a-z, 0-9 and hyphens. A handle already claimed by someone else is rejected.
    validations:
      required: true
  - type: input
    id: owner_hash
    attributes:
      label: owner_hash
      description: 64 hex characters, generated by the site. Never paste the key itself.
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: visibility
      description: anonymous shows an id like anon-k7q2m3x on the ladders; handle shows your handle. The text and card are public either way.
      options:
        - anonymous
        - handle
      default: 0
    validations:
      required: true
  - type: dropdown
    id: ladder_hint
    attributes:
      label: ladder_hint
      description: The ladder shown first. The analysis decides which ladders the entry qualifies for.
      options:
        - general
        - finance
        - tech
        - academia
      default: 0
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: text
      description: The anonymized text from the preview, 400 to 15,000 characters, placeholders like [name] and [email] left in place.
      render: text
    validations:
      required: true
  - type: textarea
    id: metrics_json
    attributes:
      label: metrics_json
      description: Generated by the site. Leave it as is.
      render: json
      value: "{}"
  - type: input
    id: client_version
    attributes:
      label: client_version
      description: Generated by the site.
