name: rerank
run-name: "rerank ${{ github.event_name }}"

on:
  schedule:
    - cron: "*/10 * * * *"   # may be delayed under load; every submission also triggers a run
  workflow_run:
    workflows: [submit]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        type: string
        required: false
        default: manual
        description: "why (shows in the run list)"

permissions:
  contents: write   # ratings, history, matches, arena, queue, status
  actions: write    # re-enable the schedules; dispatch deploy

# Serialized writer. A burst of submissions collapses into one running + one pending run. Nightly maintenance
# shares this group.
concurrency:
  group: rerank
  cancel-in-progress: false

jobs:
  rerank:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50   # spec D-21; the engine's soft wall clock is 35 minutes
    env:
      RA_DATA_DIR: ${{ github.workspace }}/data
      RA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RA_TRIGGER: ${{ github.event_name }}
      RA_ENV: production
      RA_LLM_MODE: live
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      # cards/<ab>.json, rows/<ab>.json and history/** for touched ids are added by the engine once it knows them.
      - uses: ./.github/actions/data-checkout
        with:
          patterns: |
            /settings.json
            /status.json
            /.gitattributes
            /anchors/
            /ratings/
            /queue/
            /arena/
            /usage/
            /failures/

      # Writes `deploy=true|false` to $GITHUB_OUTPUT (spec §8.3).
      - name: Rerank
        id: rerank
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node engine/src/cli.ts rerank --summary "$GITHUB_STEP_SUMMARY" --out "$GITHUB_OUTPUT"

      - name: Keep schedules enabled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for w in rerank.yml maintenance.yml; do
            gh api --silent -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$w/enable" || true
          done

      # Bot pushes never fire `push`, so deploy is dispatched explicitly (spec D-20).
      - name: Deploy indexes
        if: steps.rerank.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="rerank $GITHUB_RUN_ID"

      # record-failure never calls a model; mock mode keeps it from needing the API key.
      - name: Record failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RA_LLM_MODE: mock
        run: node engine/src/cli.ts record-failure --workflow rerank --run "$RA_RUN_ID" || true
