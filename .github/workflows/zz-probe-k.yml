name: zz-probe-k
run-name: "${{ inputs.action || 'issue' }} ${{ inputs.submission_id || github.event.issue.number }}"

on:
  workflow_dispatch:
    # Exactly the ten inputs of SubmissionPayload (spec D-12, §7.1). The Issue Forms carry the same ids.
    inputs:
      action:
        type: string
        required: true
        default: "submit"
        description: "submit | delete | set_visibility"
      submission_id:
        type: string
        required: true
        description: "10-char base32 id"
      handle:
        type: string
        required: true
        description: "3-20 chars [a-z0-9-]"
      owner_hash:
        type: string
        required: true
        description: "hex sha256 of the owner key"
      visibility:
        type: string
        required: false
        default: "anonymous"
        description: "handle | anonymous"
      text:
        type: string
        required: false
        default: ""
        description: "anonymized text <= 15000 chars"
      metrics_json:
        type: string
        required: false
        default: "{}"
        description: "LayoutMetrics JSON"
      ladder_hint:
        type: string
        required: false
        default: ""
        description: "general | finance | tech | academia"
      client_version:
        type: string
        required: false
        default: ""
        description: "SPA build id"
      owner_key:
        type: string
        required: false
        default: ""
        description: "raw owner key (manage actions, resubmission)"
  issues:
    types: [opened]

permissions:
  contents: write   # push to the data branch
  issues: write     # comment, label, close, lock on the Issue path
  actions: write    # count runs for the hourly cap; re-enable the schedules

# One run per submission id at a time. A re-run of a finished run finds its document and exits noop.
concurrency:
  group: "submit-${{ inputs.submission_id || github.event.issue.number }}"
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo probe
